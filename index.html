<!DOCTYPE html>
<html lang="en/pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Odin Project</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="calculadora">
        <div class="mostrar">
            <input type="text" class="expressao" id="expressao" inputmode="none" autocomplete="off" spellcheck="false">
            <div class="resultado" id="resultado"></div>
        </div>
        <div class="buttons">
            <button class="btn-limpar" data-valor="C">C</button>
            <button class="btn-voltar" data-valor="←">←</button>
            <button class="btn-operador" data-valor="/">/</button>
            <button class="btn-operador" data-valor="*">*</button>
            <button class="btn" data-valor="7">7</button>
            <button class="btn" data-valor="8">8</button>
            <button class="btn" data-valor="9">9</button>
            <button class="btn-operador" data-valor="-">-</button>
            <button class="btn" data-valor="4">4</button>
            <button class="btn" data-valor="5">5</button>
            <button class="btn" data-valor="6">6</button>
            <button class="btn-operador" data-valor="+">+</button>
            <button class="btn" data-valor="1">1</button>
            <button class="btn" data-valor="2">2</button>
            <button class="btn" data-valor="3">3</button>
            <button class="btn-igual" data-valor="=">=</button>
            <button class="btn-zero" data-valor="0">0</button>
            <button class="btn-decimal" data-valor=".">.</button>
        </div>

    </div>
    
</body>
</html>
